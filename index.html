<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Frailejón Ernesto Pérez 🌿</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header class="header">

      <div>
        <h1>🌿 Frailejón Ernesto Pérez</h1>
        <p id="subtitulo">
          ¡Bienvenido al páramo colombiano!
        </p>
      </div>

      <div class="agua-contador">
        💧 <span id="agua">0</span>
      </div>

    </header>


    <main id="escenario">

      <!-- CIELO -->

      <div class="cielo"></div>

      <div class="sol">☀️</div>

      <div class="luna">🌙</div>

      <div class="estrellas">
        ✦　✧　✦　　　✧　✦
      </div>


      <!-- NUBES -->

      <div class="nube nube1">☁️</div>
      <div class="nube nube2">☁️</div>


      <!-- MONTAÑAS -->

      <div class="montana montana1"></div>
      <div class="montana montana2"></div>
      <div class="montana montana3"></div>


      <!-- NIEBLA -->

      <div class="niebla"></div>


      <!-- MARIPOSAS -->

      <div class="mariposa mariposa1">🦋</div>
      <div class="mariposa mariposa2">🦋</div>


      <!-- BURBUJA -->

      <div id="burbuja">
        ¡Hola! 🌿
      </div>


      <!-- =====================
           FRAILEJÓN
      ====================== -->

      <div id="frailejon">


        <!-- HOJAS TRASERAS -->

        <div class="hojas traseras">

          <div class="hoja h1"></div>
          <div class="hoja h2"></div>
          <div class="hoja h3"></div>
          <div class="hoja h4"></div>
          <div class="hoja h5"></div>
          <div class="hoja h6"></div>
          <div class="hoja h7"></div>
          <div class="hoja h8"></div>

        </div>


        <!-- CABEZA -->

        <div class="cabeza">

          <div class="pelusa p1"></div>
          <div class="pelusa p2"></div>
          <div class="pelusa p3"></div>
          <div class="pelusa p4"></div>
          <div class="pelusa p5"></div>
          <div class="pelusa p6"></div>


          <!-- OJO IZQUIERDO -->

          <div class="ojo ojo-izquierdo">
            <div class="pupila"></div>
          </div>


          <!-- OJO DERECHO -->

          <div class="ojo ojo-derecho">
            <div class="pupila"></div>
          </div>


          <div class="mejilla izquierda"></div>
          <div class="mejilla derecha"></div>


          <div class="nariz"></div>


          <div id="boca"></div>

        </div>


        <!-- CUERPO -->

        <div class="cuerpo">


          <!-- BRAZO IZQUIERDO -->

          <div
            id="brazoIzquierdo"
            class="brazo brazo-izquierdo"
          >

            <div class="mano">
              🌿
            </div>

          </div>


          <!-- BRAZO DERECHO -->

          <div
            id="brazoDerecho"
            class="brazo brazo-derecho"
          >

            <div class="mano">
              🌿
            </div>

          </div>


          <!-- TRONCO -->

          <div class="tronco">

            <div class="linea-tronco"></div>
            <div class="linea-tronco linea2"></div>
            <div class="linea-tronco linea3"></div>

          </div>


          <!-- PIERNAS -->

          <div class="pierna pierna-izquierda"></div>
          <div class="pierna pierna-derecha"></div>


          <!-- ZAPATOS -->

          <div class="zapato zapato-izquierdo"></div>
          <div class="zapato zapato-derecho"></div>

        </div>

      </div>


      <!-- SUELO -->

      <div class="suelo">

        <div class="plantas">
          🌿 🌱 🌿 🌱 🌿 🌱 🌿 🌱 🌿
        </div>

      </div>


      <!-- LLUVIA -->

      <div id="lluvia"></div>


      <!-- GOTAS DE AGUA -->

      <div id="gotas"></div>


    </main>


    <!-- CONTROLES -->

    <section class="controles">

      <button id="btnSaludar">
        👋 Saludar
      </button>

      <button id="btnHablar">
        🗣️ Hablar
      </button>

      <button id="btnBailar">
        💃 Bailar
      </button>

      <button id="btnCaminar">
        🚶 Caminar
      </button>

      <button id="btnLluvia">
        🌧️ Lluvia
      </button>

      <button id="btnNoche">
        🌙 Noche
      </button>

      <button id="btnAgua">
        💧 Buscar agua
      </button>

    </section>


    <div class="mensaje">

      <p id="mensaje">
        ¡Ayuda a cuidar nuestros páramos!
      </p>

    </div>


    <footer>

      🌱 Proyecto web inspirado en el páramo colombiano 🇨🇴

    </footer>

  </div>


  <script src="script.js"></script>

</body>
</html>
